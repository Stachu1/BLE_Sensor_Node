# --- peripherals ---
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
# I2C / ADC power down between uses
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# No 32 kHz crystal on the board: LFCLK from the RC (MPSL calibrates it)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Bluetooth: broadcaster only, 0 dBm ---
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="BSN-N52"
CONFIG_BT_CTLR_TX_PWR_0=y

# --- no console / logging in the product build (see debug.conf) ---
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=1024
