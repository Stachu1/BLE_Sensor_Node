# Console over RTT: the board has no UART (only SWD, I2C and INT are wired)
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_PM_DEVICE=y

# LFCLK: no 32 kHz crystal on this board (XL1/XL2 unconnected) -> internal RC.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# (MPSL requires the RC calibration; it may briefly run the HFXO now and then)

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="BSN-N52-HWTEST"

CONFIG_MAIN_STACK_SIZE=1536
CONFIG_ASSERT=n
