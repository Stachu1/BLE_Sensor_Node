# LFCLK=rc: X2 (32.768 kHz) not fitted. LF clock from the internal RC (LFRC),
# the same choice as LFOSC on the C23 boards.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_NRF_GRTC_TIMER_SOURCE_SYSTEM_LFCLK=y
# RC calibration as rare as the BLE stack allows. The default (die temperature every 4 s,
# HFXO recalibration at least every 8 s) dominated the standby floor: 4.89 uA on board #2.
# MPSL refuses an uncalibrated RC, so: temperature check every 8 s (MPSL's maximum, rc_ctiv = 32
# quarter-seconds; 63 s made bt_enable() fail and the node never advertised), recalibrate only on a
# 0.5 degC change or after 33 intervals (~4.4 min). The node only needs to wake roughly on time.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=8000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=32
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
